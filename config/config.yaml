# Configuración del Sistema de Renderizado Distribuido

cluster:
  scheduler_port: 8786
  dashboard_port: 8787
  host: '0.0.0.0'
  n_workers: 0  # 0 = sin workers locales (solo remotos)
  
  timeouts:
    connect: 60s
    tcp: 60s
  
  worker:
    profile_interval: 2000ms

rendering:
  fractal_type: mandelbrot  # 'mandelbrot' o 'julia'
  default_preset: "480p_rapido"
  output_dir: "./frames_renderizados"
  video_output: "fractal_zoom.mp4"
  fps: 15
  
  # Usar versión optimizada con NumPy/Numba
  use_optimized: true
  
  # Usar aceleración GPU con CUDA (requiere GPU NVIDIA + CuPy)
  # Si no está disponible, hace fallback automático a use_optimized
  use_cuda: true  # ✓ ACTIVADO - GPU funcionando
  cuda_device: 0  # ID del dispositivo GPU (0 = primera GPU)
  
  # Comprimir frames antes de enviar por red
  # NOTA: Desactivado por defecto para mejor compatibilidad con GUI
  compress_frames: false
  compression_level: 6  # 1-9, mayor = más compresión pero más lento

cache:
  enabled: true
  cache_dir: "./cache"
  max_size_mb: 1024  # Tamaño máximo del caché en MB
  auto_cleanup: true

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  console: true
  file: true
  log_dir: "./logs"

fractals:
  mandelbrot:
    default_center:
      x: -0.7436438870371587
      y: 0.1318259042053119
    zoom_range:
      initial: 1.0
      final: 30000.0
  
  julia:
    # Constante c para el conjunto de Julia
    # Valores interesantes:
    # (-0.7, 0.27015): "Douady's rabbit" - estructura dendrítica
    # (-0.4, 0.6): "San Marco fractal" - simetría cuádruple
    # (0.285, 0.01): "Siegel disk" - espirales suaves
    # (-0.70176, -0.3842): Estructura de "dragón"
    c_real: -0.7
    c_imag: 0.27015
    default_center:
      x: 0.0
      y: 0.0
    zoom_range:
      initial: 1.0
      final: 2.0  # Julia no requiere zoom extremo

gui:
  theme: dark
  auto_refresh_interval: 1000  # ms
  preview_update_interval: 50  # Actualizar preview cada N filas
